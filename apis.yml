name: Plus Simple
description: >-
  +Simple (Plus Simple) is a French digital insurance underwriting agency (agence de
  souscription) founded in 2015 and headquartered in Marseille. Operating as one of France's
  largest wholesale insurance brokers, it runs a fully digital extranet platform that lets
  partner insurance brokers prospect, price, underwrite, issue, and manage professional
  insurance contracts across more than 1,200 covered activities and 30+ niche product lines,
  including RC Décennale (ten-year construction liability) coverage. +Simple distributes on a
  100% brokerage model in partnership with carriers such as Hiscox, Allianz, Wakam, QBE and
  Beazley, serving a network of 8,000+ partner brokers. The company is backed by Anthemis and
  Speedinvest and was added to the API Evangelist network as a venture-portfolio lead; it
  publishes no public API or developer surface at this time (its broker and insured portals are
  authenticated web applications, not open APIs).
